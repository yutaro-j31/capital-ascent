name: Game CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Simulation and invariant tests
        run: node --test tests/*.test.cjs
      - name: Strategy balance smoke
        run: node tools/balance-sim.cjs --ci

  webkit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: iPhone WebKit smoke
        run: npx playwright test
